<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS Display</title>
</head>
<style>
    .block {
        background: #000;
        color: white;
        width: 100px;
        height: 100px;
        border-radius: 15px;
        text-align: center;
        display: inline-block;
    }
    .inline {
        background: red;
        color: white;
        width: 100px;
        height: 100px;
        border-radius: 15px;
        text-align: center;
        display: block;
    }
</style>
<body>
    <div class="block">First Blog element</div>
    <h1 class="block">second block element</h1>
    <p class="block">third block element</p>
    <hr>
    <span class="inline">first inline element</span>
    <button class="inline">second inline element</button>
    <input class="inline" type="text" placeholder="another inline element">
</body>
</html>
